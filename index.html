<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Lab — Sample mini layout</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 1rem;
         background: #111; color: #eee; }
  main { max-width: 40rem; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  p.meta { color: #999; margin: 0 0 1.5rem; font-size: .85rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .5rem .4rem; border-bottom: 1px solid #333; }
  th { color: #999; font-weight: 600; font-size: .8rem; text-transform: uppercase; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Sample mini layout</h1>
  <p class="meta">
    Season 2025 &middot;
    3 bunkers &middot;
    field 45.72 &times; 36.58 m &middot;
    generated 2026-08-19T09:54:30.894Z
  </p>
  <table>
    <thead>
      <tr><th>From</th><th>To</th><th class="num">Distance (m)</th></tr>
    </thead>
    <tbody>
      <tr><td>centre-temple</td><td>snake-dorito</td><td class="num">10.99</td></tr>
      <tr><td>home-can</td><td>centre-temple</td><td class="num">16.41</td></tr>
      <tr><td>home-can</td><td>snake-dorito</td><td class="num">17.77</td></tr>
    </tbody>
  </table>
</main>
</body>
</html>
